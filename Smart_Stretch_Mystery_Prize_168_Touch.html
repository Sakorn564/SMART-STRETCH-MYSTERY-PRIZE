<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>SMART STRETCH GAME • Mystery Prize</title>
<style>
:root{--bg:#030a12;--panel:#091725;--line:#234563;--cyan:#42ddff;--green:#55e5a2;--text:#f4f9ff;--muted:#9bb0c5}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:radial-gradient(circle at 50% -10%,#173653 0,#07121f 38%,#02070d 100%);color:var(--text);font-family:Arial,"Noto Sans Thai",sans-serif;min-height:100vh}
.top{width:min(1500px,96vw);margin:auto;text-align:center;padding:12px 0 8px}
.robot{width:100%;height:145px;object-fit:cover;object-position:center;border-radius:20px;border:1px solid #264864;box-shadow:0 12px 38px #0008}
h1{font-size:clamp(24px,3.5vw,48px);margin:12px 0 3px;letter-spacing:.8px}
h1 span{color:var(--cyan)} .sub{color:var(--muted);font-size:clamp(13px,1.5vw,19px);margin:0 0 8px}
.info{display:flex;justify-content:center;gap:10px;flex-wrap:wrap;margin:7px 0 12px}
.info div{background:#0b1b2c;border:1px solid var(--line);border-radius:12px;padding:7px 16px}
.info b{color:var(--cyan);font-size:22px} .info small{color:var(--muted);margin-left:6px}
.grid{width:min(1500px,96vw);margin:auto;display:grid;grid-template-columns:repeat(12,1fr);gap:8px;padding:0 0 18px}
.tile{border:1px solid #285171;border-radius:13px;background:linear-gradient(145deg,#10283d,#071522);aspect-ratio:1/1;min-width:0;cursor:pointer;position:relative;overflow:hidden;box-shadow:0 5px 15px #0005;transition:transform .12s,border-color .12s}
.tile:active{transform:scale(.93)} .tile:hover{border-color:var(--cyan);box-shadow:0 0 17px #42ddff28}
.tile img{width:100%;height:100%;object-fit:cover;display:block}
.tile .number{position:absolute;top:4px;right:5px;background:#06111ddd;border-radius:20px;padding:3px 6px;font-size:10px;color:#b8cee1}
.tile.revealed{background:linear-gradient(145deg,#123f37,#09221f);border-color:var(--green);cursor:default}
.tile.revealed .robot-img{display:none}
.tile .prize{display:none;height:100%;padding:9px;align-items:center;justify-content:center;text-align:center;font-weight:900;font-size:clamp(10px,1.05vw,16px);line-height:1.25}
.tile.revealed .prize{display:flex}
.tile.revealed .number{background:#0b3328;color:var(--green)}
.footer{text-align:center;color:#7189a2;font-size:12px;padding:0 15px 18px}
.overlay{position:fixed;inset:0;background:#000c;display:none;place-items:center;padding:20px;z-index:30}
.modal{width:min(650px,94vw);background:linear-gradient(145deg,#102c43,#07131f);border:1px solid #4b789e;border-radius:28px;padding:28px;text-align:center;box-shadow:0 30px 100px #000}
.modal .big{font-size:76px} .badge{display:inline-block;background:#123e36;color:var(--green);padding:7px 14px;border-radius:99px;font-weight:900}
.modal h2{font-size:30px;margin:12px 0;color:var(--cyan)}
.winner{font-size:clamp(27px,4vw,44px);font-weight:900;line-height:1.25;margin:18px 0 24px}
.modal button{border:0;border-radius:15px;padding:14px 34px;font-size:21px;font-weight:900;background:linear-gradient(135deg,var(--cyan),#557cff);color:#001018;cursor:pointer}
@media(max-width:1100px){.grid{grid-template-columns:repeat(10,1fr)}}
@media(max-width:800px){.grid{grid-template-columns:repeat(7,1fr);gap:7px}.robot{height:110px}}
@media(max-width:520px){.grid{grid-template-columns:repeat(5,1fr)}.robot{height:90px}}
</style>
</head>

const STORAGE = "smartStretchMysteryPrize2026";
const grid = document.getElementById("grid");
const left = document.getElementById("left");
const overlay = document.getElementById("overlay");
const winner = document.getElementById("winner");

function makePool(){
  const pool=[];
  prizeTypes.forEach(p=>{ for(let i=0;i<p.qty;i++) pool.push(p.name); });
  // Shuffle the physical prize assignment so nobody can predict where a prize is.
  for(let i=pool.length-1;i>0;i--){
    const j=Math.floor(Math.random()*(i+1));
    [pool[i],pool[j]]=[pool[j],pool[i]];
  }
  return pool.map((name,i)=>({id:i+1,name,revealed:false}));
}

let state = JSON.parse(localStorage.getItem(STORAGE) || "null");
if(!state || !Array.isArray(state.tiles) || state.tiles.length !== 168){
  state={tiles:makePool()};
  save();
}

function save(){localStorage.setItem(STORAGE,JSON.stringify(state));}

function render(){
  grid.innerHTML="";
  let remaining=0;
  state.tiles.forEach(tile=>{
    if(!tile.revealed) remaining++;
    const el=document.createElement("div");
    el.className="tile"+(tile.revealed?" revealed":"");
    el.innerHTML=`
      <span class="number">#${String(tile.id).padStart(3,"0")}</span>
      <img class="robot-img" src="${ROBOT}" alt="">
      <div class="prize">${escapeHtml(tile.name)}</div>`;
    if(!tile.revealed) el.onclick=()=>reveal(tile.id);
    grid.appendChild(el);
  });
  left.textContent=remaining;
}

function escapeHtml(s){
  return s.replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[c]));
}

function reveal(id){
  const tile=state.tiles.find(x=>x.id===id);
  if(!tile || tile.revealed) return;
  tile.revealed=true;
  save();
  render();
  winner.textContent=tile.name;
  overlay.style.display="grid";
}

function closeWinner(){overlay.style.display="none";}
overlay.addEventListener("click",e=>{if(e.target===overlay) closeWinner();});
render();
</script>
